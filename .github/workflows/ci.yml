name: CI

on:
  workflow_call:
    inputs:
      source_ref:
        description: Source ref to verify; defaults to the calling workflow ref
        required: false
        default: ''
        type: string
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      # CI verifies unpublished host changes with the current Dashboard source.
      # Release packaging still downloads its explicitly versioned Dashboard asset.
      DashboardDistPath: ${{ github.workspace }}/artifacts/dashboard-source/dist
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Checkout Dashboard
        uses: actions/checkout@v7.0.1
        with:
          repository: ShirokaProject/Shirobot.Dashboard
          ref: main
          path: artifacts/dashboard-source
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: artifacts/dashboard-source/package-lock.json

      - name: Build Dashboard for host verification
        working-directory: artifacts/dashboard-source
        run: |
          npm ci
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          # Keep the target runtime available while building with the latest stable SDK.
          dotnet-version: |
            11.0.x
            latest
          dotnet-quality: ga

      - name: Resolve latest stable NuGet packages
        run: python .github/scripts/update_nuget_packages.py

      - name: Check SDK ABI version map
        shell: bash
        run: |
          set -euo pipefail
          prop() { sed -n "s/.*<$1>\([^<]*\)<.*/\1/p" Directory.Build.props | head -1; }
          echo "SHIROBOT_PRODUCT_VERSION=$(prop ShiroBotProductVersion)" >> "$GITHUB_ENV"
          row="| $(prop ShiroBotProductVersion) | $(prop ShiroBotSdkAbiVersion) | $(prop ShiroBotQqModelAbiVersion) | $(prop ShiroBotDiscordModelAbiVersion) | $(prop ShiroBotTelegramModelAbiVersion) |"
          for file in SDK/README.md docs/plugin/api-compatibility.md; do
            if ! grep -F -- "$row" "$file" > /dev/null; then
              echo "::error file=$file::Missing SDK/ABI version map row: $row"
              exit 1
            fi
          done

      - name: Verify release ZIP tooling
        run: python3 -m unittest discover -s .github/scripts -p test_release_zip.py -v

      - name: Build and verify core
        shell: bash
        run: |
          set -euo pipefail
          dotnet build Shirobot.slnx -c Release
          # Building with a newer SDK must not raise the minimum installed .NET 11 patch.
          jq -e '
            .runtimeOptions.configProperties["System.Diagnostics.Debugger.IsSupported"] == true and
            .runtimeOptions.configProperties["System.Diagnostics.StackTrace.IsSupported"] == true and
            .runtimeOptions.rollForward == "LatestPatch" and
            (.runtimeOptions.frameworks | length == 2 and
              all(.[]; .version == "11.0.0") and
              (map(.name) | sort) == ["Microsoft.AspNetCore.App", "Microsoft.NETCore.App"])
          ' Core/bin/Release/net11.0/ShiroBot.runtimeconfig.json
          dotnet run --project Tests/Verification/ShiroBot.Verification.csproj -c Release --no-build
          dotnet run --project Tests/Verification/ShiroBot.Verification.csproj -c Release --no-build -- --memory-retention
          dotnet run --project Tests/Verification/ShiroBot.Verification.csproj -c Release --no-build -- --avalonia-lazy
          dotnet run --project Tests/ApiBaseline/ShiroBot.ApiBaseline.csproj -c Release

      - name: Verify Runtime Async
        shell: bash
        run: |
          set -euo pipefail
          dotnet build Tests/Verification/ShiroBot.Verification.csproj -c Release -t:Rebuild -p:Features=runtime-async=on
          dotnet run --project Tests/Verification/ShiroBot.Verification.csproj -c Release --no-build

      - name: Pack SDK and smoke-test NuGet consumer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nuget "$RUNNER_TEMP/package-smoke"
          dotnet pack SDK/Packaging/ShiroBot.SDK.Package.csproj -c Release -o artifacts/nuget --no-build
          dotnet pack Templates/ShiroBot.Templates/ShiroBot.Templates.csproj -c Release -o artifacts/nuget --no-build
          avalonia_version="$(sed -n 's/.*<PackageVersion Include="Avalonia" Version="\([^"]*\)".*/\1/p' Directory.Packages.props)"
          test -n "$avalonia_version"
          unzip -p artifacts/nuget/ShiroBot.SDK.${SHIROBOT_PRODUCT_VERSION}.nupkg ShiroBot.SDK.nuspec | grep -Fq "<dependency id=\"Avalonia\" version=\"$avalonia_version\""
          test "$(find artifacts/nuget -maxdepth 1 -name '*.nupkg' | wc -l)" -eq 2
          unzip -l artifacts/nuget/ShiroBot.SDK.${SHIROBOT_PRODUCT_VERSION}.nupkg | grep -q 'lib/net11.0/ShiroBot.SDK.dll'
          unzip -l artifacts/nuget/ShiroBot.SDK.${SHIROBOT_PRODUCT_VERSION}.nupkg | grep -q 'lib/net11.0/ShiroBot.Model.Discord.dll'
          unzip -l artifacts/nuget/ShiroBot.SDK.${SHIROBOT_PRODUCT_VERSION}.nupkg | grep -q 'lib/net11.0/ShiroBot.Model.QQ.dll'
          unzip -l artifacts/nuget/ShiroBot.SDK.${SHIROBOT_PRODUCT_VERSION}.nupkg | grep -q 'lib/net11.0/ShiroBot.Model.Telegram.dll'

          cat > "$RUNNER_TEMP/package-smoke/Smoke.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net11.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <ShiroBotPluginPackagingEnabled>true</ShiroBotPluginPackagingEnabled>
              <ShiroBotPluginSharedAssemblies>ShiroBot.Model.QQ</ShiroBotPluginSharedAssemblies>
              <ShiroBotAvaloniaPreviewerSupport>true</ShiroBotAvaloniaPreviewerSupport>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="ShiroBot.SDK" Version="__SHIROBOT_VERSION__" />
            </ItemGroup>
          </Project>
          EOF
          sed -i "s/__SHIROBOT_VERSION__/${SHIROBOT_PRODUCT_VERSION}/g" "$RUNNER_TEMP/package-smoke/Smoke.csproj"
          cat > "$RUNNER_TEMP/package-smoke/Smoke.cs" <<'EOF'
          using ShiroBot.SDK.Core;
          using ShiroBot.SDK.Plugin;
          using ShiroBot.Model.QQ;
          using ShiroBot.AvaloniaSdk;
          using Avalonia.Controls;

          namespace PackageSmoke;

          [BotPlugin("PackageSmoke", Name = "Package Smoke", Version = "1.0.0", IsPluginSingleFile = true)]
          public sealed class Smoke : PluginBase
          {
              public override string Name => "PackageSmoke";

              public ControlRenderOptions Options { get; } = ControlRenderOptions.Default;
              public Type QqModelType { get; } = typeof(QGroup);
              public Type QqOfficialMessageApiType { get; } = typeof(IQOfficialMessageApi);
              public QOfficialMarkdown Markdown { get; } = new QCustomMarkdown("# smoke");

              public Task<byte[]> RenderAsync() => Context.RenderControlPngAsync<Card>();
          }

          public partial class Card : UserControl
          {
          }
          EOF
          cat > "$RUNNER_TEMP/package-smoke/Card.axaml" <<'EOF'
          <UserControl xmlns="https://github.com/avaloniaui"
                       xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"
                       x:Class="PackageSmoke.Card"
                       Width="320"
                       Height="180">
            <TextBlock Text="ShiroBot SDK Avalonia smoke test" />
          </UserControl>
          EOF

          # The designer needs an unmerged executable assembly, entry point and runtime config.
          dotnet build "$RUNNER_TEMP/package-smoke/Smoke.csproj" -c Debug \
            -p:ShiroBotPluginPackagingEnabled=false \
            --source "$GITHUB_WORKSPACE/artifacts/nuget" \
            --source https://api.nuget.org/v3/index.json
          test -f "$RUNNER_TEMP/package-smoke/bin/Debug/net11.0/Smoke.runtimeconfig.json"
          test -f "$RUNNER_TEMP/package-smoke/bin/Debug/net11.0/Avalonia.DesignerSupport.dll"
          test -f "$RUNNER_TEMP/package-smoke/obj/Debug/net11.0/ShiroBot.AvaloniaSdk.DesignerPreviewEntryPoint.g.cs"

          dotnet publish "$RUNNER_TEMP/package-smoke/Smoke.csproj" -c Release \
            -o "$RUNNER_TEMP/package-smoke/publish" \
            --source "$GITHUB_WORKSPACE/artifacts/nuget" \
            --source https://api.nuget.org/v3/index.json
          test -f "$RUNNER_TEMP/package-smoke/publish/Smoke.dll"
          test ! -f "$RUNNER_TEMP/package-smoke/publish/ShiroBot.SDK.dll"
          test ! -f "$RUNNER_TEMP/package-smoke/publish/ShiroBot.Model.QQ.dll"
          test ! -f "$RUNNER_TEMP/package-smoke/publish/ShiroBot.Model.Discord.dll"
          test ! -f "$RUNNER_TEMP/package-smoke/publish/ShiroBot.Model.Telegram.dll"
          test ! -f "$RUNNER_TEMP/package-smoke/publish/ShiroBot.AvaloniaSdk.dll"
          test ! -f "$RUNNER_TEMP/package-smoke/publish/Avalonia.dll"
          test ! -d "$RUNNER_TEMP/package-smoke/publish/runtimes"

      - name: Smoke-test project templates
        shell: bash
        run: |
          set -euo pipefail
          template_root="$RUNNER_TEMP/template-smoke"
          dotnet new install artifacts/nuget/ShiroBot.Templates.${SHIROBOT_PRODUCT_VERSION}.nupkg --force
          # Exit 105 means the project was created but its optional scripts were denied.
          create_template() {
            local result=0
            dotnet new "$@" --allow-scripts no || result=$?
            if [ "$result" -ne 0 ] && [ "$result" -ne 105 ]; then return "$result"; fi
          }
          create_template shirobot-plugin -n TemplatePlugin --platform qq -o "$template_root/TemplatePlugin"
          create_template shirobot-adapter -n TemplateAdapter --platform discord -o "$template_root/TemplateAdapter"
          grep -Fq "PackageVersion Include=\"ShiroBot.SDK\" Version=\"${SHIROBOT_PRODUCT_VERSION}\"" "$template_root/TemplatePlugin/Directory.Packages.props"
          grep -Fq "PackageVersion Include=\"ShiroBot.SDK\" Version=\"${SHIROBOT_PRODUCT_VERSION}\"" "$template_root/TemplateAdapter/Directory.Packages.props"
          test -f "$template_root/TemplatePlugin/.github/workflows/release.yml"
          test -f "$template_root/TemplateAdapter/.github/workflows/release.yml"
          test -f "$template_root/TemplatePlugin/Properties/launchSettings.json"
          test -f "$template_root/TemplateAdapter/Properties/launchSettings.json"
          grep -q '<ShiroBotAvaloniaPreviewerSupport .*true</ShiroBotAvaloniaPreviewerSupport>' "$template_root/TemplatePlugin/TemplatePlugin.csproj"
          grep -q '<ShiroBotAvaloniaPreviewerSupport .*true</ShiroBotAvaloniaPreviewerSupport>' "$template_root/TemplateAdapter/TemplateAdapter.csproj"
          test -f "$template_root/TemplateAdapter/TemplateAdapter.slnx"
          test -f "$template_root/TemplatePlugin/src/Plugin.cs"
          test -f "$template_root/TemplateAdapter/src/Adapter.cs"
          test -f "$template_root/TemplateAdapter/TestPlugin/src/Plugin.cs"
          test -f "$template_root/TemplatePlugin/scripts/dev.sh"
          test -f "$template_root/TemplateAdapter/scripts/dev.ps1"
          test -f "$template_root/TemplateAdapter/TestPlugin/TemplateAdapter.TestPlugin.csproj"
          grep -q 'dotnet build TemplatePlugin.csproj' "$template_root/TemplatePlugin/.github/workflows/release.yml"
          grep -q 'dotnet build TemplateAdapter.csproj' "$template_root/TemplateAdapter/.github/workflows/release.yml"
          dotnet build "$template_root/TemplatePlugin/TemplatePlugin.csproj" -c Release \
            --source "$GITHUB_WORKSPACE/artifacts/nuget" \
            --source https://api.nuget.org/v3/index.json
          dotnet build "$template_root/TemplateAdapter/TemplateAdapter.csproj" -c Release \
            --source "$GITHUB_WORKSPACE/artifacts/nuget" \
            --source https://api.nuget.org/v3/index.json
          for component in TemplatePlugin TemplateAdapter; do
            component_root="$template_root/$component"
            dotnet run --project "$component_root/scripts/version-check/VersionCheck.csproj" -c Release -- \
              "$component_root/bin/Release/net11.0/$component.dll" 1.0.0 1.0.0
            if dotnet run --project "$component_root/scripts/version-check/VersionCheck.csproj" -c Release --no-build -- \
              "$component_root/bin/Release/net11.0/$component.dll" 1.0.0 9.9.9; then
              echo "Version verifier accepted an incorrect release tag for $component" >&2
              exit 1
            fi
          done
          test ! -f "$template_root/TemplatePlugin/bin/Release/net11.0/ShiroBot.SDK.dll"
          test ! -f "$template_root/TemplatePlugin/bin/Release/net11.0/ShiroBot.Model.QQ.dll"
          dotnet build "$template_root/TemplateAdapter/TestPlugin/TemplateAdapter.TestPlugin.csproj" -c Release \
            --source "$GITHUB_WORKSPACE/artifacts/nuget" \
            --source https://api.nuget.org/v3/index.json
          test ! -f "$template_root/TemplateAdapter/bin/Release/net11.0/TemplateAdapter.TestPlugin.dll"
          test ! -f "$template_root/TemplateAdapter/bin/Release/net11.0/ShiroBot.SDK.dll"
          test ! -f "$template_root/TemplateAdapter/bin/Release/net11.0/ShiroBot.Model.Discord.dll"

      - name: Smoke-test single-file built-in Model
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/shirobot-single-file"
          plugin_dir="$RUNNER_TEMP/shirobot-single-file-plugin/ShiroBot.SharedContractPluginProbe"
          config_path="$RUNNER_TEMP/shirobot-single-file.toml"
          response_path="$RUNNER_TEMP/shirobot-models.json"
          plugin_response_path="$RUNNER_TEMP/shirobot-plugins.json"

          dotnet publish Core/ShiroBot.csproj -c Release -r linux-x64 \
            --self-contained true \
            -o "$output_dir" \
            /p:RequireDashboard=true \
            /p:PublishSingleFile=true \
            /p:IncludeNativeLibrariesForSelfExtract=true

          test -f "$output_dir/ShiroBot"
          test ! -f "$output_dir/ShiroBot.Model.Discord.dll"
          test ! -f "$output_dir/ShiroBot.Model.QQ.dll"
          test ! -f "$output_dir/ShiroBot.Model.Telegram.dll"
          test ! -f "$output_dir/ShiroBot.SDK.dll"

          dotnet publish Tests/SharedContractPluginProbe/ShiroBot.SharedContractPluginProbe.csproj -c Release \
            -o "$plugin_dir"
          test -f "$plugin_dir/ShiroBot.SharedContractPluginProbe.dll"
          test ! -f "$plugin_dir/ShiroBot.Model.QQ.dll"
          test ! -f "$plugin_dir/ShiroBot.SDK.dll"

          cat > "$config_path" <<'EOF'
          protocol = ""
          protocols = []
          enable_log = false
          disable_console_input = true

          [api]
          enable = true
          listen_urls = ["http://127.0.0.1:17081"]
          public_base_url = []
          token = "single-file-ci-test-token"
          EOF

          "$output_dir/ShiroBot" --config "$config_path" \
            --plugin-dir "$(dirname "$plugin_dir")" &
          host_pid=$!
          trap 'kill "$host_pid" 2>/dev/null || true; wait "$host_pid" 2>/dev/null || true' EXIT

          curl --fail --silent --show-error \
            -H 'Authorization: Bearer single-file-ci-test-token' \
            --retry 40 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:17081/api/v1/models/list \
            -o "$response_path"

          # Public exposure must not bypass API authentication.
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:17081/api/v1/models/list)" = 401

          jq -e --arg version "$SHIROBOT_PRODUCT_VERSION" '
            length == 3 and
            all(.[]; .version == $version and .path == null and .source == "built_in" and .reloadable == false) and
            ([.[] | {id, assembly}] | sort_by(.id)) == [
              {id: "shirobot.model.discord", assembly: "ShiroBot.Model.Discord"},
              {id: "shirobot.model.qq", assembly: "ShiroBot.Model.QQ"},
              {id: "shirobot.model.telegram", assembly: "ShiroBot.Model.Telegram"}
            ]
          ' "$response_path"

          for attempt in $(seq 1 40); do
            curl --fail --silent --show-error \
              -H 'Authorization: Bearer single-file-ci-test-token' \
              http://127.0.0.1:17081/api/v1/plugins/list -o "$plugin_response_path"
            if jq -e 'any(.[]; .id == "SharedContractPluginProbe" and .enable == true)' "$plugin_response_path"; then break; fi
            sleep 1
          done
          jq -e 'any(.[]; .id == "SharedContractPluginProbe" and .enable == true)' "$plugin_response_path"

          curl --fail --silent --show-error \
            http://127.0.0.1:17081/dashboard/ \
            -o /dev/null

      - name: Verify host rebuild in a different checkout directory
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/shirobot-repro-source"
          output_dir="$RUNNER_TEMP/shirobot-repro-publish"
          git clone --quiet --shared "$GITHUB_WORKSPACE" "$source_dir"
          git -C "$source_dir" remote set-url origin "$(git remote get-url origin)"
          dotnet publish "$source_dir/Core/ShiroBot.csproj" -c Release -r linux-x64 \
            --self-contained true -o "$output_dir" \
            /p:RequireDashboard=true \
            /p:PublishSingleFile=true \
            /p:IncludeNativeLibrariesForSelfExtract=true
          cmp "$RUNNER_TEMP/shirobot-single-file/ShiroBot" "$output_dir/ShiroBot"
          sha256sum "$output_dir/ShiroBot"

      - name: Reject old ABI plugin in single-file host
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/shirobot-single-file"
          plugin_dir="$RUNNER_TEMP/shirobot-legacy-plugin/ShiroBot.SharedContractPluginProbe"
          config_path="$RUNNER_TEMP/shirobot-single-file.toml"
          response_path="$RUNNER_TEMP/shirobot-legacy-plugins.json"
          log_path="$RUNNER_TEMP/shirobot-legacy-host.log"
          legacy_build_root="$RUNNER_TEMP/shirobot-legacy-abi-build"

          # Keep console output for troubleshooting; assertions use unwrapped API diagnostics.
          sed -i 's/^enable_log = false$/enable_log = true/' "$config_path"

          dotnet publish Tests/SharedContractPluginProbe/ShiroBot.SharedContractPluginProbe.csproj -c Release \
            -o "$plugin_dir" \
            /p:ShiroBotSdkAbiVersion=0.8.0.0 \
            /p:ShiroBotQqModelAbiVersion=0.8.0.0 \
            /p:BaseOutputPath="$legacy_build_root/bin/" \
            '/p:IntermediateOutputPath='"$legacy_build_root"'/obj/$(MSBuildProjectName)/'
          test -f "$plugin_dir/ShiroBot.SharedContractPluginProbe.dll"
          test ! -f "$plugin_dir/ShiroBot.SDK.dll"
          test ! -f "$plugin_dir/ShiroBot.Model.QQ.dll"

          "$output_dir/ShiroBot" --config "$config_path" \
            --plugin-dir "$(dirname "$plugin_dir")" > "$log_path" 2>&1 &
          host_pid=$!
          trap 'kill "$host_pid" 2>/dev/null || true; wait "$host_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error \
            -H 'Authorization: Bearer single-file-ci-test-token' \
            --retry 40 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:17081/api/v1/plugins/list -o "$response_path"
          for attempt in $(seq 1 40); do
            curl --fail --silent --show-error -H 'Authorization: Bearer single-file-ci-test-token' http://127.0.0.1:17081/api/v1/plugins/list -o "$response_path"
            if jq -e 'any(.[]; .id == "SharedContractPluginProbe" and .status == "error")' "$response_path"; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error -H 'Authorization: Bearer single-file-ci-test-token' http://127.0.0.1:17081/api/v1/plugins/list -o "$response_path"
          jq -e 'all(.[]; .id != "SharedContractPluginProbe" or .enable != true)' "$response_path"
          # Check the explicit preflight diagnostic as well as disabled state: absence alone is insufficient.
          # Spectre may wrap console lines at the redirected runner's width, splitting both strings.
          cat "$log_path"
          jq -e 'any(.[];
            .id == "SharedContractPluginProbe" and .enable == false and .status == "error" and
            ((.errorMessage // "") | contains("Component contract preflight failed before activation:") and contains("Version=0.8.0.0"))
          )' "$response_path"

  verify-shadow-cleanup-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          # Keep the target runtime available while building with the latest stable SDK.
          dotnet-version: |
            11.0.x
            latest
          dotnet-quality: ga

      - name: Resolve latest stable NuGet packages
        run: python .github/scripts/update_nuget_packages.py
      - name: Verify deferred shadow cleanup with a Windows file lock
        run: dotnet run --project Tests/Verification/ShiroBot.Verification.csproj -c Release -- --shadow-cleanup
