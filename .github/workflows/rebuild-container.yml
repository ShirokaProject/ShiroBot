name: Rebuild released container

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released host version whose verified binaries should be reused
        required: true
        default: '1.0.0'

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: shirobot-container-publication
  cancel-in-progress: false

jobs:
  resolve:
    outputs:
      run_id: ${{ steps.release.outputs.run_id }}
      image: ${{ steps.release.outputs.image }}
      minor: ${{ steps.release.outputs.minor }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Find successful release build
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "v$VERSION" > /dev/null
          run_id="$(gh run list --workflow build.yml --branch "v$VERSION" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id" && test "$run_id" != null
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shirobot" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    uses: ./.github/workflows/verify-container.yml
    with:
      run_id: ${{ fromJSON(needs.resolve.outputs.run_id) }}

  rebuild:
    needs: [resolve, verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          pattern: shirobot-container-linux-musl-*64
          path: artifacts/docker
          merge-multiple: true

      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Containerfile
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ needs.resolve.outputs.image }}:${{ inputs.version }}
            ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.minor }}
            ${{ needs.resolve.outputs.image }}:latest
          build-args: |
            VERSION_TAG=v${{ inputs.version }}
