name: Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_NOLOGO: '1'
  CONFIGURATION: Release
  HOST_PROJECT: Core/ShiroBot.csproj
  SOLUTION_FILE: Shirobot.slnx

jobs:
  prepare:
    name: Prepare shared assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*<ShiroBotProductVersion>\([^<]*\)<.*/\1/p' Directory.Build.props | head -1)"
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "::error::Tag and ShiroBotProductVersion must match"; exit 1; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack NuGet packages
        run: |
          set -euo pipefail

          dotnet restore "${{ env.SOLUTION_FILE }}" --property:Configuration="${{ env.CONFIGURATION }}"

          dotnet pack Packaging/ShiroBot.SDK.Package/ShiroBot.SDK.Package.csproj \
            --configuration "${{ env.CONFIGURATION }}" \
            --no-restore \
            --output artifacts/nuget \
            /p:ContinuousIntegrationBuild=true

          dotnet pack Templates/ShiroBot.Templates/ShiroBot.Templates.csproj \
            --configuration "${{ env.CONFIGURATION }}" \
            --no-restore \
            --output artifacts/nuget \
            /p:ContinuousIntegrationBuild=true

          dotnet run --project Tests/Verification/ShiroBot.Verification.csproj \
            --configuration "${{ env.CONFIGURATION }}" \
            --no-restore

      - name: Download dashboard dist
        run: |
          set -euo pipefail

          version="$(sed -n 's/.*<ShirobotDashboardVersion>\([^<]*\)<.*/\1/p' Directory.Build.props | head -1)"
          if [ -z "$version" ]; then
            echo "::error::Directory.Build.props 缺少 ShirobotDashboardVersion"
            exit 1
          fi

          base="https://github.com/ShirokaProject/Shirobot.Dashboard/releases/download/v${version}"
          archive="shirobot-dashboard-${version}.zip"

          curl -fsSL "$base/$archive" -o "/tmp/$archive"
          curl -fsSL "$base/$archive.sha256" -o "/tmp/$archive.sha256"
          (cd /tmp && sha256sum -c "$archive.sha256")

          mkdir -p Core/Assets/dashboard
          unzip -q -o "/tmp/$archive" -d Core/Assets/dashboard
          test -f Core/Assets/dashboard/index.html

          echo "已获取 Dashboard v${version} 成品资源"

      - name: Upload dashboard assets
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-assets
          path: Core/Assets/dashboard/**
          if-no-files-found: error

  publish-host:
    name: Publish ${{ matrix.runtime }} ${{ matrix.publish_kind }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64, linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64, osx-x64, osx-arm64]
        publish_kind: [framework-dependent, self-contained]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download dashboard assets
        uses: actions/download-artifact@v4
        with:
          name: dashboard-assets
          path: Core/Assets/dashboard

      - name: Publish host package
        run: |
          set -euo pipefail

          mkdir -p artifacts/archives

          runtime='${{ matrix.runtime }}'
          publish_kind='${{ matrix.publish_kind }}'

          self_contained=false
          if [ "$publish_kind" = "self-contained" ]; then
            self_contained=true
          fi

          output_dir="artifacts/host/${runtime}-${publish_kind}"
          host_exe="ShiroBot"
          if [[ "$runtime" == win-* ]]; then
            host_exe="ShiroBot.exe"
          fi
          archive_path="$GITHUB_WORKSPACE/artifacts/archives/shirobot-host-${runtime}-${publish_kind}.zip"

          dotnet publish "${{ env.HOST_PROJECT }}" \
            --configuration "${{ env.CONFIGURATION }}" \
            --runtime "$runtime" \
            --self-contained "$self_contained" \
            --output "$output_dir" \
            /p:ContinuousIntegrationBuild=true \
            /p:RequireDashboard=true \
            /p:DashboardDistPath="$GITHUB_WORKSPACE/Core/Assets/dashboard" \
            /p:PublishSingleFile=true \
            /p:IncludeNativeLibrariesForSelfExtract=true

          test -f "$output_dir/$host_exe"
          test ! -f "$output_dir/ShiroBot.Model.Discord.dll"
          test ! -f "$output_dir/ShiroBot.Model.QQ.dll"
          test ! -f "$output_dir/ShiroBot.Model.Telegram.dll"
          test ! -f "$output_dir/ShiroBot.SDK.dll"

          chmod +x "$output_dir/$host_exe"
          (cd "$output_dir" && zip -9 -j "$archive_path" "$host_exe")

      - name: Upload host archive
        uses: actions/upload-artifact@v4
        with:
          name: shirobot-host-${{ matrix.runtime }}-${{ matrix.publish_kind }}
          path: artifacts/archives/*.zip
          if-no-files-found: error

      - name: Publish layered container files
        if: startsWith(matrix.runtime, 'linux-musl-') && matrix.publish_kind == 'framework-dependent'
        run: |
          set -euo pipefail
          runtime='${{ matrix.runtime }}'
          arch=amd64
          if [ "$runtime" = linux-musl-arm64 ]; then arch=arm64; fi
          dotnet publish "${{ env.HOST_PROJECT }}" \
            --configuration "${{ env.CONFIGURATION }}" \
            --runtime "$runtime" --self-contained false \
            --output "artifacts/container-publish/$arch" \
            /p:ContinuousIntegrationBuild=true /p:RequireDashboard=true \
            /p:DashboardDistPath="$GITHUB_WORKSPACE/Core/Assets/dashboard" \
            /p:PublishSingleFile=false /p:IncludeNativeLibrariesForSelfExtract=false \
            /p:DebugType=none /p:CopyOutputSymbolsToPublishDirectory=false
          sh scripts/split-container-publish.sh "artifacts/container-publish/$arch" "artifacts/docker/$arch"

      - name: Upload container files
        if: startsWith(matrix.runtime, 'linux-musl-') && matrix.publish_kind == 'framework-dependent'
        uses: actions/upload-artifact@v4
        with:
          name: shirobot-container-${{ matrix.runtime }}
          path: artifacts/docker/
          if-no-files-found: error

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: publish-host
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download layered container files
        uses: actions/download-artifact@v4
        with:
          pattern: shirobot-container-linux-musl-*64
          path: artifacts/docker
          merge-multiple: true

      - name: Normalize downloaded container files
        run: |
          set -euo pipefail

          for arch in amd64 arm64; do
            test -f "artifacts/docker/$arch/application/ShiroBot.dll"
            find "artifacts/docker/$arch" -type f -exec chmod 644 {} +
            find "artifacts/docker/$arch" -type d -exec chmod 755 {} +
            chmod +x "artifacts/docker/$arch/application/ShiroBot"
          done

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shirobot" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION_TAG=${{ github.ref_name }}
            BUILD_TIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  nuget:
    name: Validate and publish NuGet after all release builds
    needs: [prepare, publish-host, docker]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-nuget.yml

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, publish-host, docker, nuget]
    steps:
      - name: Checkout release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: validated-nuget-packages
          path: artifacts/nuget

      - name: Download host archives
        uses: actions/download-artifact@v4
        with:
          pattern: shirobot-host-*
          path: artifacts/archives
          merge-multiple: true

      - name: Create release notes
        run: |
          set -euo pipefail

          tag='${{ github.ref_name }}'
          repo='${{ github.repository }}'
          base_url="https://github.com/${repo}/releases/download/${tag}"
          notes_file=".github/release-notes/${tag}.md"
          previous_tag="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          range="$tag"
          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..${tag}"
          fi

          features=()
          fixes=()
          improvements=()
          while IFS= read -r subject; do
            case "$subject" in
              ""|"Release ShiroBot "*|"Prepare ShiroBot "*) continue ;;
              feat:*|feat\(*) features+=("$subject") ;;
              fix:*|fix\(*) fixes+=("$subject") ;;
              *) improvements+=("$subject") ;;
            esac
          done < <(git log --no-merges --reverse --format=%s "$range")

          write_changes() {
            local heading="$1"
            shift
            if [ "$#" -eq 0 ]; then return; fi
            echo "#### ${heading}"
            echo
            for subject in "$@"; do
              echo "- ${subject}"
            done
            echo
          }

          link_asset() {
            local name="$1"
            if [ -f "artifacts/archives/${name}" ] || [ -f "artifacts/nuget/${name}" ]; then
              printf '[%s](%s/%s)' "$2" "$base_url" "$name"
            else
              printf '%s' "$2"
            fi
          }

          host_link() {
            local runtime="$1"
            local publish="$2"
            local label="$3"
            link_asset "shirobot-host-${runtime}-${publish}.zip" "$label"
          }

          {
            echo "## ${tag}"
            echo
            echo "### 更新日志"
            echo
            # A hand-written changelog in .github/release-notes/<tag>.md replaces the commit list.
            if [ -f "$notes_file" ]; then
              cat "$notes_file"
              echo
            else
              write_changes "新功能" "${features[@]}"
              write_changes "修复问题" "${fixes[@]}"
              write_changes "其他改进" "${improvements[@]}"
              if [ "${#features[@]}" -eq 0 ] && [ "${#fixes[@]}" -eq 0 ] && [ "${#improvements[@]}" -eq 0 ]; then
                echo "- 本次发布没有单独记录的代码改动。"
                echo
              fi
            fi
            echo "## 下载地址"
            echo
            echo "#### 自带运行时 self-contained（推荐，不需要预装 .NET）"
            echo
            echo "- Windows: $(host_link win-x64 self-contained x64) | $(host_link win-arm64 self-contained ARM64)"
            echo "- macOS: $(host_link osx-arm64 self-contained Apple芯片) | $(host_link osx-x64 self-contained Intel芯片)"
            echo "- Linux: $(host_link linux-x64 self-contained x64) | $(host_link linux-arm64 self-contained ARM64)"
            echo "- Linux musl / Alpine: $(host_link linux-musl-x64 self-contained x64) | $(host_link linux-musl-arm64 self-contained ARM64)"
            echo
            echo "#### 不自带运行时 framework-dependent（需要安装 ASP.NET Core 10 Runtime）"
            echo
            echo "- Windows: $(host_link win-x64 framework-dependent x64) | $(host_link win-arm64 framework-dependent ARM64)"
            echo "- macOS: $(host_link osx-arm64 framework-dependent Apple芯片) | $(host_link osx-x64 framework-dependent Intel芯片)"
            echo "- Linux: $(host_link linux-x64 framework-dependent x64) | $(host_link linux-arm64 framework-dependent ARM64)"
            echo "- Linux musl / Alpine: $(host_link linux-musl-x64 framework-dependent x64) | $(host_link linux-musl-arm64 framework-dependent ARM64)"
            echo
            echo "> Linux 渲染需要 fontconfig 和字体（Debian/Ubuntu: \`apt install libfontconfig1 fonts-noto-cjk\`）。"
            echo "> Alpine 还需要 .NET 依赖：\`apk add libstdc++ libgcc icu-libs fontconfig font-noto-cjk\`。"
            echo
            owner="$(echo "${repo%%/*}" | tr '[:upper:]' '[:lower:]')"
            echo "### Docker 镜像（linux/amd64、linux/arm64）"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${owner}/shirobot:${tag#v}"
            echo '```'
            echo
            echo "### NuGet 包"
            echo
            prop() { sed -n "s/.*<$1>\([^<]*\)<.*/\1/p" Directory.Build.props | head -1; }
            api_version="$(sed -n 's/.*CurrentVersion = "\([^"]*\)".*/\1/p' SDK/Core/ShiroBotApi.cs)"
            echo "ShiroBot API ${api_version} · SDK ABI $(prop ShiroBotSdkAbiVersion) · QQ Model ABI $(prop ShiroBotQqModelAbiVersion) · Discord Model ABI $(prop ShiroBotDiscordModelAbiVersion) · Telegram Model ABI $(prop ShiroBotTelegramModelAbiVersion)"
            echo
            for package in artifacts/nuget/*.nupkg; do
              [ -e "$package" ] || continue
              file_name="$(basename "$package")"
              echo "- [${file_name}](${base_url}/${file_name})"
            done
          } > RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag='${{ github.ref_name }}'
          repo='${{ github.repository }}'

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$repo" --notes-file RELEASE_NOTES.md
          else
            gh release create "$tag" --repo "$repo" --title "$tag" --notes-file RELEASE_NOTES.md --draft
          fi

          gh release upload "$tag" --repo "$repo" --clobber \
            artifacts/archives/*.zip \
            artifacts/nuget/*.nupkg

          gh release edit "$tag" --repo "$repo" --draft=false
          echo "已发布 Release ${tag}"
