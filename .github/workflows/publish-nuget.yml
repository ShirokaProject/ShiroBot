name: Publish NuGet packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: SDK package version, for example 0.9.5
        required: true
        type: string
      template_version:
        description: Optional template-only package version (SDK version stays unchanged)
        required: false
        type: string

jobs:
  publish:
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            "value=${{ inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            $tag = '${{ github.ref_name }}'
            "value=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT
          }
          $templateVersion = '${{ inputs.template_version }}'
          if ([string]::IsNullOrWhiteSpace($templateVersion)) {
            $templateVersion = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          }
          "template=$templateVersion" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore .\Shirobot.slnx

      - name: Validate release version
        shell: pwsh
        run: |
           $expected = '${{ steps.version.outputs.value }}'
           [xml]$buildProps = Get-Content .\Directory.Build.props
           $productVersion = $buildProps.Project.PropertyGroup.ShiroBotProductVersion | Select-Object -First 1
           if ($productVersion -ne $expected) {
             throw "Release version $expected does not match ShiroBotProductVersion=$productVersion."
           }

      - name: Build
        timeout-minutes: 5
        shell: pwsh
        run: |
          if ('${{ inputs.template_version }}' -eq '') {
            dotnet build .\Shirobot.slnx -c Release --no-restore
          } else {
            dotnet build .\Templates\ShiroBot.Templates\ShiroBot.Templates.csproj -c Release --no-restore
          }

      - name: Install lifecycle diagnostics
        if: inputs.template_version == ''
        run: dotnet tool install --global dotnet-dump

      - name: Verify
        if: inputs.template_version == ''
        timeout-minutes: 5
        env:
          SHIROBOT_LIFECYCLE_DIAGNOSTICS: 'true'
        run: dotnet run --project .\Tests\Verification\ShiroBot.Verification.csproj -c Release --no-build
      - name: Pack SDK packages
        if: inputs.template_version == ''
        run: dotnet pack .\Packaging\ShiroBot.SDK.Package\ShiroBot.SDK.Package.csproj -c Release -o artifacts\nuget --no-build --no-restore

      - name: Pack template package
        run: dotnet pack .\Templates\ShiroBot.Templates\ShiroBot.Templates.csproj -c Release -o artifacts\nuget --no-build --no-restore -p:Version=${{ steps.version.outputs.template }}

      - name: Validate packed template SDK references
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = Join-Path $PWD 'artifacts/nuget/ShiroBot.Templates.${{ steps.version.outputs.template }}.nupkg'
          $zip = [System.IO.Compression.ZipFile]::OpenRead($package)
          try {
            foreach ($kind in @('plugin', 'adapter')) {
              $entry = $zip.GetEntry("content/templates/$kind/Directory.Packages.props")
              if ($null -eq $entry) { throw "Missing $kind SDK references in template package." }
              $reader = [System.IO.StreamReader]::new($entry.Open())
              try { $text = $reader.ReadToEnd() } finally { $reader.Dispose() }
              if (!$text.Contains('Include="ShiroBot.SDK" Version="${{ steps.version.outputs.value }}"')) {
                throw "Incorrect $kind SDK version in template package: $text"
              }
            }
          } finally { $zip.Dispose() }

      - name: Verify template project generation
        shell: pwsh
        run: |
          $package = Join-Path $PWD 'artifacts/nuget/ShiroBot.Templates.${{ steps.version.outputs.template }}.nupkg'
          dotnet new install $package --force
          if ($LASTEXITCODE -ne 0) { throw 'Template installation failed.' }
          foreach ($kind in @('plugin', 'adapter')) {
            $output = Join-Path $env:RUNNER_TEMP "template-smoke-$kind"
            dotnet new "shirobot-$kind" -n SmokeProject -o $output --allow-scripts no
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 105) { throw "$kind template creation failed." }
            $props = Get-Content (Join-Path $output 'Directory.Packages.props') -Raw
            if (!$props.Contains('Include="ShiroBot.SDK" Version="${{ steps.version.outputs.value }}"')) { throw "$kind generated SDK reference is incorrect." }
            if (!(Test-Path (Join-Path $output 'Properties/launchSettings.json'))) { throw "$kind launch settings missing." }
          }
          exit 0

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: greepar

      - name: Push to NuGet.org
        run: |
           if ('${{ inputs.template_version }}' -eq '') {
           dotnet nuget push artifacts\nuget\ShiroBot.SDK.${{ steps.version.outputs.value }}.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
           }
           dotnet nuget push artifacts\nuget\ShiroBot.Templates.${{ steps.version.outputs.template }}.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
