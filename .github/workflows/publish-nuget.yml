name: Publish NuGet packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: SDK package version, for example 0.9.1
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            "value=${{ inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            $tag = '${{ github.ref_name }}'
            "value=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT
          }

      - name: Restore
        run: dotnet restore .\Shirobot.slnx

      - name: Validate release version
        shell: pwsh
        run: |
           $expected = '${{ steps.version.outputs.value }}'
           [xml]$buildProps = Get-Content .\Directory.Build.props
           $productVersion = $buildProps.Project.PropertyGroup.ShiroBotProductVersion | Select-Object -First 1
           if ($productVersion -ne $expected) {
             throw "Release version $expected does not match ShiroBotProductVersion=$productVersion."
           }

      - name: Build and verify
        run: |
          dotnet build .\Shirobot.slnx -c Release --no-restore
          dotnet run --project .\Tests\Verification\ShiroBot.Verification.csproj -c Release --no-build
      - name: Pack SDK packages
        run: |
           dotnet pack .\Packaging\ShiroBot.SDK.Package\ShiroBot.SDK.Package.csproj -c Release -o artifacts\nuget --no-build --no-restore
           dotnet pack .\Templates\ShiroBot.Templates\ShiroBot.Templates.csproj -c Release -o artifacts\nuget --no-build --no-restore

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: greepar

      - name: Push to NuGet.org
        run: |
           dotnet nuget push artifacts\nuget\ShiroBot.SDK.${{ steps.version.outputs.value }}.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
           dotnet nuget push artifacts\nuget\ShiroBot.Templates.${{ steps.version.outputs.value }}.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
