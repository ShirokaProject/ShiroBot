name: Publish NuGet packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: SDK package version, for example 0.9.0
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            "value=${{ inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            $tag = '${{ github.ref_name }}'
            "value=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT
          }

      - name: Restore
        run: dotnet restore .\Shirobot.slnx

      - name: Validate release version
        shell: pwsh
        run: |
           $expected = '${{ steps.version.outputs.value }}'
           [xml]$hostProject = Get-Content .\Core\ShiroBot.csproj
           [xml]$sdkProject = Get-Content .\SDK\ShiroBot.SDK.csproj
           [xml]$discordModelProject = Get-Content .\Models\Discord\ShiroBot.Model.Discord.csproj
           [xml]$qqModelProject = Get-Content .\Models\QQ\ShiroBot.Model.QQ.csproj
           [xml]$telegramModelProject = Get-Content .\Models\Telegram\ShiroBot.Model.Telegram.csproj
           $sdkVersion = $sdkProject.Project.PropertyGroup.Version | Select-Object -First 1
           $hostVersion = $hostProject.Project.PropertyGroup.Version | Select-Object -First 1
           $discordModelVersion = $discordModelProject.Project.PropertyGroup.Version | Select-Object -First 1
           $qqModelVersion = $qqModelProject.Project.PropertyGroup.Version | Select-Object -First 1
           $telegramModelVersion = $telegramModelProject.Project.PropertyGroup.Version | Select-Object -First 1
           [xml]$templateProject = Get-Content .\Templates\ShiroBot.Templates\ShiroBot.Templates.csproj
           $templateVersion = $templateProject.Project.PropertyGroup.Version | Select-Object -First 1
           $versions = @($hostVersion, $sdkVersion, $discordModelVersion, $qqModelVersion, $telegramModelVersion, $templateVersion)
           if ($versions | Where-Object { $_ -ne $expected }) {
             throw "Release version $expected does not match Host=$hostVersion, SDK=$sdkVersion, DiscordModel=$discordModelVersion, QQModel=$qqModelVersion, TelegramModel=$telegramModelVersion, Templates=$templateVersion."
           }

      - name: Build and verify
        run: |
          dotnet build .\Shirobot.slnx -c Release --no-restore
          dotnet run --project .\Tests\Verification\ShiroBot.Verification.csproj -c Release --no-build
      - name: Pack SDK packages
        run: |
           dotnet pack .\Models\Discord\ShiroBot.Model.Discord.csproj -c Release -o artifacts\nuget --no-build --no-restore
           dotnet pack .\Models\QQ\ShiroBot.Model.QQ.csproj -c Release -o artifacts\nuget --no-build --no-restore
           dotnet pack .\Models\Telegram\ShiroBot.Model.Telegram.csproj -c Release -o artifacts\nuget --no-build --no-restore
           dotnet pack .\SDK\ShiroBot.SDK.csproj -c Release -o artifacts\nuget --no-build --no-restore
           dotnet pack .\Templates\ShiroBot.Templates\ShiroBot.Templates.csproj -c Release -o artifacts\nuget --no-build --no-restore

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg

      - name: Push to NuGet.org
        if: ${{ env.NUGET_API_KEY != '' }}
        run: |
           dotnet nuget push artifacts\nuget\ShiroBot.Model.Discord.${{ steps.version.outputs.value }}.nupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
           dotnet nuget push artifacts\nuget\ShiroBot.Model.QQ.${{ steps.version.outputs.value }}.nupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
           dotnet nuget push artifacts\nuget\ShiroBot.Model.Telegram.${{ steps.version.outputs.value }}.nupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
           dotnet nuget push artifacts\nuget\ShiroBot.SDK.${{ steps.version.outputs.value }}.nupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
           dotnet nuget push artifacts\nuget\ShiroBot.Templates.${{ steps.version.outputs.value }}.nupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
