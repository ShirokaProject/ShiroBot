name: Publish NuGet packages

on:
  workflow_call:
    inputs:
      version:
        description: SDK package version; defaults to the calling release tag
        required: false
        default: ''
        type: string
      template_version:
        description: Optional template-only patch version
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: SDK package version, for example 0.9.5
        required: true
        type: string
      template_version:
        description: Optional template-only package version (SDK version stays unchanged)
        required: false
        type: string

# Only one NuGet publication may pass the version preflight at a time.
concurrency:
  group: shirobot-nuget-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-core:
    uses: ./.github/workflows/ci.yml

  validate:
    runs-on: windows-latest

    permissions:
      contents: read

    outputs:
      sdk-version: ${{ steps.version.outputs.value }}
      template-version: ${{ steps.version.outputs.template }}
      template-only: ${{ inputs.template_version != '' }}

    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify release gate regressions
        run: python -m unittest discover -s .github/scripts -p test_verify_nuget_release.py -v

      - name: Resolve version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          TEMPLATE_VERSION_INPUT: ${{ inputs.template_version }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = $env:VERSION_INPUT
          if ([string]::IsNullOrWhiteSpace($version)) { $version = $env:RELEASE_TAG.TrimStart('v') }
          $templateVersion = $env:TEMPLATE_VERSION_INPUT
          if ([string]::IsNullOrWhiteSpace($templateVersion)) { $templateVersion = $version }
          foreach ($value in @($version, $templateVersion)) {
            if ($value -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw 'Invalid NuGet release version.' }
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          "template=$templateVersion" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore .\Shirobot.slnx

      - name: Validate release version
        shell: pwsh
        run: |
           $expected = '${{ steps.version.outputs.value }}'
           [xml]$buildProps = Get-Content .\Directory.Build.props
           $productVersion = $buildProps.Project.PropertyGroup.ShiroBotProductVersion | Select-Object -First 1
           if ($productVersion -ne $expected) {
             throw "Release version $expected does not match ShiroBotProductVersion=$productVersion."
           }

      - name: Build all projects
        timeout-minutes: 10
        run: dotnet build .\Shirobot.slnx -c Release --no-restore

      - name: Install lifecycle diagnostics
        run: dotnet tool install --global dotnet-dump

      - name: Verify
        timeout-minutes: 5
        env:
          SHIROBOT_LIFECYCLE_DIAGNOSTICS: 'true'
        run: dotnet run --project .\Tests\Verification\ShiroBot.Verification.csproj -c Release --no-build

      - name: Pack SDK packages
        if: inputs.template_version == ''
        run: dotnet pack .\Packaging\ShiroBot.SDK.Package\ShiroBot.SDK.Package.csproj -c Release -o artifacts\nuget --no-build --no-restore

      - name: Pack template package
        run: dotnet pack .\Templates\ShiroBot.Templates\ShiroBot.Templates.csproj -c Release -o artifacts\nuget --no-build --no-restore -p:Version=${{ steps.version.outputs.template }}

      - name: Verify package contents and compile generated plugin and adapter projects
        timeout-minutes: 15
        env:
          SDK_VERSION: ${{ steps.version.outputs.value }}
          TEMPLATE_VERSION: ${{ steps.version.outputs.template }}
          TEMPLATE_ONLY: ${{ inputs.template_version != '' }}
        run: python .github/scripts/verify_nuget_release.py

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validated-nuget-packages
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
            artifacts/nuget/validated-checksums.json
          if-no-files-found: error

  publish:
    # No credentials or upload until host CI and every package/consumer check succeeds.
    needs: [verify-core, validate]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          name: validated-nuget-packages
          path: artifacts/nuget

      - name: Check every package version before any upload
        env:
          SDK_VERSION: ${{ needs.validate.outputs.sdk-version }}
          TEMPLATE_VERSION: ${{ needs.validate.outputs.template-version }}
          TEMPLATE_ONLY: ${{ needs.validate.outputs.template-only }}
        run: python .github/scripts/verify_nuget_release.py --preflight

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: greepar

      - name: Push verified packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          SDK_VERSION: ${{ needs.validate.outputs.sdk-version }}
          TEMPLATE_VERSION: ${{ needs.validate.outputs.template-version }}
          TEMPLATE_ONLY: ${{ needs.validate.outputs.template-only }}
        run: python .github/scripts/verify_nuget_release.py --push
