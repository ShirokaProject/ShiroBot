when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: publish-linux-x64
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - dotnet run --project Tests/Verification/ShiroBot.Verification.csproj -c Release
      - dotnet publish Core/ShiroBot.csproj -c Release -r linux-x64 --self-contained true -o artifacts/publish/linux-x64 -p:PublishSingleFile=true -p:PublishAot=false -p:IncludeNativeLibrariesForSelfExtract=true -p:RequireDashboard=true
      - test -x artifacts/publish/linux-x64/ShiroBot
      - test ! -f artifacts/publish/linux-x64/ShiroBot.SDK.dll
      - mkdir -p artifacts/release
      - cp artifacts/publish/linux-x64/ShiroBot artifacts/release/ShiroBot
      - cd artifacts/release && sha256sum ShiroBot > ShiroBot.sha256

  - name: push-binary-to-zot
    image: alpine:3.21
    environment:
      ZOT_USERNAME:
        from_secret: zot_username
      ZOT_PASSWORD:
        from_secret: zot_password
    commands:
      - |
        set -eu
        apk add --no-cache curl tar ca-certificates
        curl -fsSL https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz -o /tmp/oras.tgz
        tar -xzf /tmp/oras.tgz -C /usr/local/bin oras
        printf '%s' "$ZOT_PASSWORD" | oras login registry.oeo.one -u "$ZOT_USERNAME" --password-stdin
        cd artifacts/release
        oras push --artifact-type application/vnd.shiro.bot.binary.v1 "registry.oeo.one/justme/shirobot-linux-x64:${CI_COMMIT_TAG}" ShiroBot:application/octet-stream ShiroBot.sha256:text/plain

  - name: push-image-to-zot
    image: woodpeckerci/plugin-kaniko:2.3.3
    settings:
      registry: registry.oeo.one
      repo: justme/shirobot
      tags: "${CI_COMMIT_TAG},latest"
      dockerfile: Dockerfile
      username:
        from_secret: zot_username
      password:
        from_secret: zot_password
