when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

labels:
  platform: linux/amd64
  ci: domain-linux-native

skip_clone: true

steps:
  - name: clone-public
    image: bash
    commands:
      - git init .
      - git remote add origin https://git.oeo.one/justme/ShiroBot.git
      - git fetch --depth=1 origin "${CI_COMMIT_REF}"
      - git checkout --detach FETCH_HEAD

  - name: publish-linux-x64
    image: bash
    commands:
      - dotnet run --project Tests/Verification/ShiroBot.Verification.csproj -c Release
      - dotnet publish Core/ShiroBot.csproj -c Release -r linux-x64 --self-contained true -o artifacts/publish/linux-x64 -p:PublishSingleFile=true -p:PublishAot=false -p:IncludeNativeLibrariesForSelfExtract=true -p:RequireDashboard=true
      - test -x artifacts/publish/linux-x64/ShiroBot
      - test ! -f artifacts/publish/linux-x64/ShiroBot.SDK.dll
      - mkdir -p artifacts/release
      - cp artifacts/publish/linux-x64/ShiroBot artifacts/release/ShiroBot
      - cd artifacts/release && sha256sum ShiroBot > ShiroBot.sha256

  - name: push-binary-to-zot
    image: bash
    when:
      - event: tag
    environment:
      ZOT_USERNAME:
        from_secret: zot_username
      ZOT_PASSWORD:
        from_secret: zot_password
    commands:
      - |
        set -eu
        tool_dir="$(mktemp -d)"
        trap 'rm -f "$tool_dir/oras" "$tool_dir/oras.tgz" "$tool_dir/auth.json"; rmdir "$tool_dir"' EXIT
        curl -fsSL https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz -o "$tool_dir/oras.tgz"
        tar -xzf "$tool_dir/oras.tgz" -C "$tool_dir" oras
        printf '%s' "$ZOT_PASSWORD" | "$tool_dir/oras" login --registry-config "$tool_dir/auth.json" registry.oeo.one -u "$ZOT_USERNAME" --password-stdin
        cd artifacts/release
        "$tool_dir/oras" push --registry-config "$tool_dir/auth.json" --artifact-type application/vnd.shiro.bot.binary.v1 "registry.oeo.one/justme/shirobot-linux-x64:${CI_COMMIT_TAG}" ShiroBot:application/octet-stream ShiroBot.sha256:text/plain

  - name: build-image
    image: bash
    commands:
      - buildah bud --layers -f Dockerfile -t "localhost/shirobot:${CI_COMMIT_SHA}" .

  - name: push-image-to-zot
    image: bash
    when:
      - event: tag
    environment:
      ZOT_USERNAME:
        from_secret: zot_username
      ZOT_PASSWORD:
        from_secret: zot_password
    commands:
      - |
        set -eu
        auth_dir="$(mktemp -d)"
        trap 'rm -f "$auth_dir/auth.json"; rmdir "$auth_dir"' EXIT
        printf '%s' "$ZOT_PASSWORD" | buildah login --authfile "$auth_dir/auth.json" -u "$ZOT_USERNAME" --password-stdin registry.oeo.one
        buildah tag "localhost/shirobot:${CI_COMMIT_SHA}" "registry.oeo.one/justme/shirobot:${CI_COMMIT_TAG}"
        buildah push --authfile "$auth_dir/auth.json" "registry.oeo.one/justme/shirobot:${CI_COMMIT_TAG}"
        buildah tag "localhost/shirobot:${CI_COMMIT_SHA}" registry.oeo.one/justme/shirobot:latest
        buildah push --authfile "$auth_dir/auth.json" registry.oeo.one/justme/shirobot:latest
