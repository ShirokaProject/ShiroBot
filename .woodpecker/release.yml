when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

labels:
  platform: linux/amd64
  ci: domain-linux-native

skip_clone: true

steps:
  - name: clone-public
    image: bash
    commands:
      - git init .
      - git remote add origin https://git.oeo.one/justme/ShiroBot.git
      - git fetch --depth=1 origin "${CI_COMMIT_REF}"
      - git checkout --detach FETCH_HEAD

  - name: publish-linux-x64
    image: bash
    depends_on: [clone-public]
    commands:
      - dotnet run --project Tests/Verification/ShiroBot.Verification.csproj -c Release
      - |
        release_version="${CI_COMMIT_TAG:-$(sed -n 's/.*<ShiroBotProductVersion>\([^<]*\)<.*/\1/p' Directory.Build.props | head -n 1)}"
        test -n "$release_version"
        dotnet publish Core/ShiroBot.csproj -c Release -r linux-x64 --self-contained true -o artifacts/publish/linux-x64 -p:PublishSingleFile=true -p:PublishAot=false -p:IncludeNativeLibrariesForSelfExtract=true -p:RequireDashboard=true "-p:InformationalVersion=${release_version}+${CI_COMMIT_SHA}"
      - test -x artifacts/publish/linux-x64/ShiroBot
      - test ! -f artifacts/publish/linux-x64/ShiroBot.SDK.dll

  - name: package-linux-x64
    image: bash
    depends_on: [publish-linux-x64]
    commands:
      - mkdir -p artifacts/release
      - cp artifacts/publish/linux-x64/ShiroBot artifacts/release/ShiroBot
      - sha256sum artifacts/release/ShiroBot | sed 's#artifacts/release/##' > artifacts/release/ShiroBot.sha256
      - gzip -1 -n artifacts/release/ShiroBot

  - name: build-image
    image: bash
    depends_on: [publish-linux-x64]
    commands:
      - buildah bud --layers --network=host --target prebuilt -f Dockerfile -t "localhost/shirobot:${CI_COMMIT_SHA}" .

  - name: push-binary-to-zot
    image: bash
    depends_on: [package-linux-x64, build-image]
    when:
      - event: tag
    environment:
      ZOT_USERNAME:
        from_secret: zot_username
      ZOT_PASSWORD:
        from_secret: zot_password
    commands:
      - |
        set -eu
        tool_dir="$(mktemp -d)"
        trap 'rm -f "$tool_dir/oras" "$tool_dir/oras.tgz" "$tool_dir/auth.json"; rmdir "$tool_dir"' EXIT
        curl -fsSL https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz -o "$tool_dir/oras.tgz"
        tar -xzf "$tool_dir/oras.tgz" -C "$tool_dir" oras
        zot_host="$(ip route | awk '/default/ {print $3; exit}'):5000"
        printf '%s' "$ZOT_PASSWORD" | "$tool_dir/oras" login --plain-http --registry-config "$tool_dir/auth.json" "$zot_host" -u "$ZOT_USERNAME" --password-stdin
        cd artifacts/release
        "$tool_dir/oras" push --plain-http --registry-config "$tool_dir/auth.json" --artifact-type application/vnd.shiro.bot.binary.v1 "$zot_host/justme/shirobot-linux-x64:${CI_COMMIT_TAG}" ShiroBot.gz:application/gzip ShiroBot.sha256:text/plain

  - name: push-image-to-zot
    image: bash
    depends_on: [package-linux-x64, build-image]
    when:
      - event: tag
    environment:
      ZOT_USERNAME:
        from_secret: zot_username
      ZOT_PASSWORD:
        from_secret: zot_password
    commands:
      - |
        set -eu
        auth_dir="$(mktemp -d)"
        trap 'rm -f "$auth_dir/auth.json"; rmdir "$auth_dir"' EXIT
        zot_host="$(ip route | awk '/default/ {print $3; exit}'):5000"
        printf '%s' "$ZOT_PASSWORD" | buildah login --tls-verify=false --authfile "$auth_dir/auth.json" -u "$ZOT_USERNAME" --password-stdin "$zot_host"
        buildah tag "localhost/shirobot:${CI_COMMIT_SHA}" "$zot_host/justme/shirobot:${CI_COMMIT_TAG}"
        buildah push --tls-verify=false --authfile "$auth_dir/auth.json" "$zot_host/justme/shirobot:${CI_COMMIT_TAG}"
        buildah tag "localhost/shirobot:${CI_COMMIT_SHA}" "$zot_host/justme/shirobot:latest"
        buildah push --tls-verify=false --authfile "$auth_dir/auth.json" "$zot_host/justme/shirobot:latest"
