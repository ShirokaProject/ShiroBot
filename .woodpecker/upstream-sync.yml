when:
  - event: cron
    cron: upstream-sync
  - event: manual

labels:
  platform: linux/amd64
  ci: domain-linux-native

skip_clone: true

steps:
  - name: sync-upstream
    image: bash
    environment:
      GITEA_SYNC_USERNAME:
        from_secret: gitea_sync_username
      GITEA_SYNC_TOKEN:
        from_secret: gitea_sync_token
    commands:
      - |
        set -eu
        git init .
        git remote add origin https://git.oeo.one/justme/shirobot.git
        git remote add upstream https://github.com/ShirokaProject/ShiroBot.git
        auth="$(printf '%s' "$GITEA_SYNC_USERNAME:$GITEA_SYNC_TOKEN" | base64 | tr -d '\n')"
        git -c "http.extraheader=Authorization: Basic $auth" fetch --prune --tags origin +refs/heads/master:refs/remotes/origin/master
        git fetch upstream +refs/heads/master:refs/remotes/upstream/master
        git checkout -B upstream-sync refs/remotes/origin/master
        git config user.name 'ShiroBot Upstream Sync'
        git config user.email 'shirobot-sync@oeo.one'
        if git merge-base --is-ancestor refs/remotes/upstream/master HEAD; then
          echo 'Gitea master already contains upstream master; nothing to sync.'
          exit 0
        fi
        if git merge --no-edit refs/remotes/upstream/master; then
          :
        else
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ "$conflicts" = 'Tests/Verification/Program.cs' ]; then
            git checkout --theirs -- Tests/Verification/Program.cs
            git add -- Tests/Verification/Program.cs
            git commit --no-edit
          else
            git merge --abort
            echo "Unresolved upstream conflict(s): $conflicts" >&2
            exit 1
          fi
        fi
        git -c "http.extraheader=Authorization: Basic $auth" push origin HEAD:refs/heads/master
        version="$(sed -n 's/.*<ShiroBotProductVersion>\([^<]*\)<.*/\1/p' Directory.Build.props | head -n 1)"
        test -n "$version"
        prefix="v${version}-oeo."
        max=0
        while IFS= read -r tag; do
          number="${tag#"$prefix"}"
          case "$number" in ''|*[!0-9]*) continue ;; esac
          if [ "$number" -gt "$max" ]; then max="$number"; fi
        done <<EOF
        $(git tag --list "${prefix}*")
        EOF
        release_tag="${prefix}$((max + 1))"
        git tag "$release_tag" HEAD
        git -c "http.extraheader=Authorization: Basic $auth" push origin "refs/tags/$release_tag"
        echo "Pushed $release_tag; Woodpecker release pipeline will publish the latest image."
