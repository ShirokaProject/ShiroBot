name: shirobot

services:
  shirobot:
    container_name: shirobot
    image: ghcr.io/shirokaproject/shirobot:${SHIROBOT_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:7001:7001"
    # TZ：自动更新等定时任务按此时区执行，容器默认 UTC。
    # SHIROBOT_DATA_DIR：协议端运行在宿主机上时，连同下方同路径挂载一起取消注释；宿主目录作为
    # 数据目录，插件传给协议端的文件路径在宿主机上可以直接访问。该目录需对容器用户 1654 可写。
    # environment:
    #   TZ: Asia/Shanghai
    #   SHIROBOT_DATA_DIR: /srv/shirobot
    volumes:
      - shirobot_data:/data
      # - /srv/shirobot:/srv/shirobot

volumes:
  shirobot_data:
    name: shirobot_data
