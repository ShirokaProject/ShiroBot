name: shirobot

services:
  shirobot:
    container_name: shirobot
    image: ghcr.io/shirokaproject/shirobot:${SHIROBOT_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:7001:7001"
    volumes:
      - shirobot_data:/data

volumes:
  shirobot_data:
    name: shirobot_data
