<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自定义编辑器</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 24px; }
    textarea { display: block; box-sizing: border-box; width: 100%; min-height: 180px; padding: 12px; }
    button { margin-top: 12px; padding: 8px 20px; }
    output { display: block; margin-top: 16px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>自定义编辑器</h2>
  <label for="text">输入内容</label>
  <textarea id="text" maxlength="2000">你好，ShiroBot！</textarea>
  <button id="preview" type="button">调用插件预览</button>
  <output id="result" aria-live="polite"></output>
  <script>
    document.querySelector('#preview').addEventListener('click', async () => {
      const button = document.querySelector('#preview');
      button.disabled = true;
      try {
        const value = await window.ShiroBotDashboard.call('preview', { text: document.querySelector('#text').value });
        document.querySelector('#result').textContent = `${value.text}\n共 ${value.length} 字符`;
      } catch (error) {
        document.querySelector('#result').textContent = error.message;
      } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
