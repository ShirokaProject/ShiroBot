name: Build and release adapter

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Fq "Version = \"$version\"" Adapter.cs
      - name: Restore
        run: dotnet restore AdapterTemplate.csproj
      - name: Build
        run: dotnet build AdapterTemplate.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true
      - name: Build development test plugin
        run: dotnet build TestPlugin/AdapterTemplate.TestPlugin.csproj -c Release /p:ContinuousIntegrationBuild=true
      - name: Package
        run: |
          test -f bin/Release/net10.0/AdapterTemplate.dll
          test ! -f bin/Release/net10.0/AdapterTemplate.TestPlugin.dll
          mkdir -p artifacts
          (cd bin/Release/net10.0 && zip -qr "$GITHUB_WORKSPACE/artifacts/AdapterTemplate.zip" . -x '*.[pP][dD][bB]')
          cp bin/Release/net10.0/AdapterTemplate.dll artifacts/AdapterTemplate.dll
      - uses: actions/upload-artifact@v4
        with:
          name: adapter-package
          path: |
            artifacts/AdapterTemplate.zip
            artifacts/AdapterTemplate.dll
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: adapter-package
          path: artifacts
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/AdapterTemplate.zip artifacts/AdapterTemplate.dll --clobber
          else
            gh release create "$tag" artifacts/AdapterTemplate.zip artifacts/AdapterTemplate.dll --title "$tag" --generate-notes
          fi
